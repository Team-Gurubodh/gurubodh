[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gurubodh_cli"
version = "0.1.0"
description = "Gurubodh CMS DOCX processing pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34,<2",
    "google-genai>=1.0,<2",
    "huggingface-hub>=0.23,<1",
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
    "numpy>=1.26,<2",
    "openai>=1.0,<2",
    "python-docx>=1.1,<2",
    "sentence-transformers>=3.0,<4",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.5.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers>=4.41,<4.50",
]

[project.scripts]
gurubodh = "gurubodh.cli:main"

[tool.setuptools.packages.find]
include = ["gurubodh*"]

[tool.setuptools.data-files]
"." = ["THIRD_PARTY_NOTICES.md"]
"config/jobs" = ["config/jobs/*.schema.json"]
"config/artifacts" = ["config/artifacts/*.schema.json"]
"config/policies" = ["config/policies/*.json"]
"config/job-components/schemas" = ["config/job-components/schemas/*.schema.json"]
"config/job-components/commands" = ["config/job-components/commands/*.json"]
"config/job-components/environments" = ["config/job-components/environments/*.json"]
"config/job-components/locales" = ["config/job-components/locales/*.json"]
"config/job-components/storage-profiles" = ["config/job-components/storage-profiles/*.json"]
"config/job-components/profiles/proofreading" = ["config/job-components/profiles/proofreading/*.json"]
"config/job-components/profiles/chunking" = ["config/job-components/profiles/chunking/*.json"]
"scripts" = ["scripts/legacy_font_convert.js"]
"scripts/vendor" = ["scripts/vendor/*.js"]
