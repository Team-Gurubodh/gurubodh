name: gurubodh-cli container

on:
  pull_request:
    paths:
      - "tools/gurubodh-cli/**"
      - ".github/workflows/gurubodh-cli-container.yml"
  push:
    branches: [main]
    tags: ["cli-v*"]
    paths:
      - "tools/gurubodh-cli/**"
      - ".github/workflows/gurubodh-cli-container.yml"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/team-gurubodh/gurubodh-cli

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify sdist and wheel runtime resources
        run: |
          python -m pip install build
          python -m build --outdir "${RUNNER_TEMP}/dist" tools/gurubodh-cli
          python tools/gurubodh-cli/tests/check_resource_distributions.py \
            tools/gurubodh-cli "${RUNNER_TEMP}"/dist/*.tar.gz "${RUNNER_TEMP}"/dist/*.whl

  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: tools/gurubodh-cli
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: gurubodh-cli:smoke
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            IMAGE_VERSION=sha-${{ github.sha }}
            IMAGE_CREATED=${{ github.event.repository.updated_at }}
      - name: Run CLI unit tests
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/tools/gurubodh-cli/tests:/opt/gurubodh-cli/tests:ro" \
            --workdir /opt/gurubodh-cli --entrypoint python \
            gurubodh-cli:smoke -m unittest discover -s tests -v
      - name: Verify CLI and bundled Node converter runtime
        run: |
          docker run --rm gurubodh-cli:smoke --help
          docker run --rm --entrypoint node gurubodh-cli:smoke --version
          docker run --rm --entrypoint python gurubodh-cli:smoke -c "from gurubodh.audit import resolved_build_provenance; from pathlib import Path; assert resolved_build_provenance(Path('/opt/gurubodh-cli'))['source_revision'] == '${{ github.sha }}'"
      - name: Execute installed command workflows offline as the runtime user
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,mode=1777 \
            --volume "${{ github.workspace }}/tools/gurubodh-cli/tests:/checks/tests:ro" \
            --entrypoint python gurubodh-cli:smoke \
            -I -B /checks/tests/check_installed_runtime.py
      - name: Verify installed component contracts and discovery
        run: |
          fixture_project="${RUNNER_TEMP}/gurubodh-fixture-project"
          mkdir -p "${fixture_project}/jobs/subjects/sub001_aps_example"
          cp tools/gurubodh-cli/tests/fixtures/job-components/subjects/aps-hindi.json \
            "${fixture_project}/jobs/subjects/sub001_aps_example/manifest.json"
          docker run --rm --user 0 \
            --volume "${{ github.workspace }}/tools/gurubodh-cli/tests:/checks/tests:ro" \
            --entrypoint python gurubodh-cli:smoke \
            -I /checks/tests/check_installed_components.py /checks/tests/fixtures/job-components
          docker run --rm --user 0 \
            --volume "${{ github.workspace }}/tools/gurubodh-cli/tests:/checks/tests:ro" \
            --volume "${fixture_project}:/work/project:ro" \
            --tmpfs /work/source:rw \
            --tmpfs /work/artifacts:rw \
            --entrypoint python gurubodh-cli:smoke \
            -I /checks/tests/check_installed_resources.py /work/project
      - name: Inspect all composed commands offline
        run: |
          fixture_project="${RUNNER_TEMP}/gurubodh-fixture-project"
          for command in prep-subject generate-chunks generate-docx; do
            docker run --rm \
              --volume "${fixture_project}:/work/project:ro" \
              gurubodh-cli:smoke config resolve \
              --command "${command}" \
              --project-root /work/project \
              --subject sub001_aps_example \
              --language hi-IN \
              --environment development \
              --storage-profile r2 \
            | docker run --rm -i --entrypoint python gurubodh-cli:smoke -c \
              "import json, sys; job=json.load(sys.stdin); assert job['pipeline']; assert job['source']['backend'] == job['destination']['backend'] == 'r2'; command='${command}'; assert command != 'prep-subject' or (job['proofreading']['model'] == 'gemini-3.6-flash' and job['proofreading']['max_output_tokens'] == 16384); assert command != 'generate-chunks' or (job['chunking']['model_revision'] == '5617a9f61b028005a4858fdac845db406aefb181' and job['chunking']['local_files_only'] is True and job['chunking']['strategy_version'] == 'semantic-window-v1')"
          done
      - name: Inspect all 26 maintained selectors from the baked catalog
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/tools/gurubodh-cli/tests:/opt/gurubodh-cli/tests:ro" \
            --env PYTHONPATH=/opt/gurubodh-cli/tests \
            --workdir /opt/gurubodh-cli --entrypoint python \
            gurubodh-cli:smoke -B -m unittest -v \
            test_maintained_job_migration.MaintainedJobMigrationTests.test_all_26_maintained_selectors_inspect_via_cli \
            test_maintained_job_migration.MaintainedJobMigrationTests.test_manifests_validate_independently \
            test_maintained_job_migration.MaintainedJobMigrationTests.test_manifests_preserve_every_legacy_edition
      - name: Export the tested image for publication
        if: github.event_name == 'push'
        run: |
          docker tag gurubodh-cli:smoke gurubodh-cli:tested-${{ matrix.arch }}
          docker save gurubodh-cli:tested-${{ matrix.arch }} | gzip > "${RUNNER_TEMP}/image-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: tested-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [distributions, smoke-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: tested-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/tested-images
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and assemble multi-platform tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          for arch in amd64 arm64; do
            gunzip -c "${RUNNER_TEMP}/tested-images/image-${arch}.tar.gz" | docker load
            docker tag "gurubodh-cli:tested-${arch}" "${IMAGE_NAME}:sha-${SHA}-${arch}"
            docker push "${IMAGE_NAME}:sha-${SHA}-${arch}"
            docker image rm "gurubodh-cli:tested-${arch}" "${IMAGE_NAME}:sha-${SHA}-${arch}"
          done
          tags=(--tag "${IMAGE_NAME}:sha-${SHA}")
          if [ "$REF_TYPE" = "tag" ]; then tags+=(--tag "${IMAGE_NAME}:${REF_NAME}"); fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE_NAME}:sha-${SHA}-amd64" "${IMAGE_NAME}:sha-${SHA}-arm64"
